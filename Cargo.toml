[package]
name = "fastdna"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast canonical k-mer counting from FASTQ, with a zero-copy Arrow bridge to Python"
repository = "https://github.com/Angel-Zeledon/FastDNA"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "kmer", "fastq", "arrow"]
categories = ["science", "command-line-utilities"]

[lib]
name = "fastdna_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fastdna"
path = "src/main.rs"

[dependencies]
# Base dependencies
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"

# Concurrency and data structures
rayon = "1.10"
crossbeam-channel = "0.5"
rustc-hash = "2.0"

# File processing and ML
#
# Default backend for gzip decompression: `miniz_oxide` (pure Rust, no C
# toolchain needed to build this crate). `docs/audit/performance-v2.md`
# (G-4) proposed switching unconditionally to flate2's `zlib-ng` backend
# for faster inflate; measured instead of assumed -- see the comment above
# `STREAM_BUFFER_BYTES` in `src/fastq.rs` for the full methodology and
# numbers. Short version: zlib-ng won by 2.7-3.8x decompressing a
# realistic `.fastq.gz` through this crate's own read path, in this
# project's Docker verification container. The win is real, but so is the
# cost: zlib-ng needs a C compiler and cmake at build time, which this
# line does not, and `compile.bat` (the documented native-Windows build
# path) runs a bare `cargo build --release` with neither set up. Landed as
# the opt-in `zlib-ng` feature below instead of unconditionally, so
# `default = []` keeps this line's build exactly as it is today on every
# platform this session could not verify (Windows MSVC, macOS -- see
# `src/fastq.rs` for the full list of what was and was not checked).
flate2 = "1.0"
parquet = { version = "53.4", default-features = false, features = ["flate2", "arrow", "snap"] }
arrow = "53.4"

# Optional dependencies (WebAssembly)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Optional dependency (Python). `extension-module` tells the crate not to
# link libpython, which is correct for an extension module and fatal for the
# [[bin]] target -- it must sit inside this optional dependency so only the
# `python` feature (enabled by maturin, never by `cargo build` alone) pulls
# it in.
pyo3 = { version = "0.22", features = ["abi3-py38", "extension-module"], optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
python = ["dep:pyo3", "arrow/pyarrow"]
# Opt-in: swaps flate2's inflate backend from miniz_oxide (default) to
# zlib-ng, measured 2.7-3.8x faster decompressing a realistic .fastq.gz
# through this crate's own read path (see the `flate2` dependency comment
# above and `src/fastq.rs`). Not in `default` because it needs a C
# compiler and cmake at build time that this crate otherwise does not --
# true of the manylinux wheel containers and Bioconda, not guaranteed on
# a contributor's native Windows machine building via `compile.bat`.
# Enable with `cargo build --release --features zlib-ng`, or for the
# Python wheel `maturin build --release --features python,zlib-ng`.
zlib-ng = ["flate2/zlib-ng"]

[dev-dependencies]
# Test-only: used to build throwaway sample-discovery fixture directories.
# Must never appear under [dependencies], or it would ship in the wheel.
tempfile = "3.14"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
# Required, not cosmetic: catch_unwind is a no-op under panic = "abort".
# The pipeline relies on catch_unwind to convert a panicking worker -- including a
# panicking Python progress callback -- into FastDnaError::Internal instead of
# unwinding across the FFI boundary, which is undefined behaviour. Setting abort
# here would make a worker panic kill the host Python process with no traceback,
# and no test would fail, because the suite does not run under this profile.
panic = "unwind"

# Cross-crate inlining and a single codegen unit. The hot loop calls across
# module boundaries on every base (base_to_bits, canonical_kmer_u64) and
# across the arrow/parquet crate boundary on every exported row; without fat
# LTO those calls survive as calls.
#
# Not measured on this project yet, and deliberately not: the only machine
# available swings a fixed binary between 25 s and 90 s on the same input
# depending on what Docker and WSL are holding, which cannot resolve a
# change of this size. This is kept as a reasoned default -- it removes work
# rather than trading it, and it is hardware-independent, unlike
# `-C target-cpu=native`, which is deliberately NOT set here: this crate
# ships wheels, and a binary built for one CPU's instruction set crashes on
# older machines.
#
# The cost is build time, not run time. Revisit with a real measurement when
# a controlled environment exists (CI, or a machine that is not also running
# a container runtime).
lto = "fat"
codegen-units = 1