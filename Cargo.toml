[package]
name = "fastdna"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastdna"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fastdna"
path = "src/main.rs"

[dependencies]
# Base dependencies
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"

# Concurrency and data structures
rayon = "1.10"
crossbeam-channel = "0.5"
dashmap = "5.5"
rustc-hash = "2.0"
ahash = "0.8"

# File processing and ML
flate2 = "1.0"
parquet = { version = "53.4", default-features = false, features = ["flate2", "arrow", "snap"] }
arrow = "53.4"

# Optional dependencies (WebAssembly)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"