[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fastdna"
requires-python = ">=3.8"
dependencies = ["pyarrow>=14"]
# Not in the plan's original snippet: this maturin release (1.14.1) refuses
# to build without either a static `project.version` or this `dynamic`
# declaration. `dynamic` is used, so the version stays sourced from
# Cargo.toml's `[package] version` alone -- the same value `ffi.rs` reports
# to Python via `env!("CARGO_PKG_VERSION")` -- rather than duplicating it.
dynamic = ["version"]

# Test-only: `pytest-timeout` backs `@pytest.mark.timeout(...)` in
# `python/tests/test_api.py`, used on the zero-threads regression test so a
# reintroduced hang fails the test instead of blocking the suite forever.
# Not a runtime dependency of the `fastdna` package itself.
[project.optional-dependencies]
test = ["pytest>=7", "pytest-timeout>=2.1"]

[tool.maturin]
features = ["python"]
module-name = "fastdna._core"
python-source = "python"
