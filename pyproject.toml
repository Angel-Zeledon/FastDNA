[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fastdna"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
# `license.text` above (freeform Core Metadata `License:`) does not, by
# itself, become a filterable "License ::" trove classifier on PyPI --
# confirmed against this project's own build: `maturin build` (1.14.1, the
# version pinned by `[build-system] requires` below) renders
# `License: MIT OR Apache-2.0` and no `Classifier:` line for it at all
# without these two entries. Without them, PyPI's license filter/badge
# shows nothing, even though the correct text is present elsewhere on the
# page. Matches Cargo.toml's `license = "MIT OR Apache-2.0"` and both
# LICENSE-MIT/LICENSE-APACHE files in this repo (which maturin already
# bundles into the wheel as `License-File` entries on its own, from their
# presence at the repository root -- no configuration needed for that
# part).
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
description = "Fast canonical k-mer counting from FASTQ, with a zero-copy Arrow bridge to Python"
authors = [{ name = "Angel Zeledon" }]

readme = "README.md"
keywords = ["bioinformatics", "genomics", "kmer", "fastq", "arrow"]
dependencies = ["pyarrow>=14"]
# Not in the plan's original snippet: this maturin release (1.14.1) refuses
# to build without either a static `project.version` or this `dynamic`
# declaration. `dynamic` is used, so the version stays sourced from
# Cargo.toml's `[package] version` alone -- the same value `ffi.rs` reports
# to Python via `env!("CARGO_PKG_VERSION")` -- rather than duplicating it.
dynamic = ["version"]

# Test-only: `pytest-timeout` backs `@pytest.mark.timeout(...)` in
# `python/tests/test_api.py`, used on the zero-threads regression test so a
# reintroduced hang fails the test instead of blocking the suite forever.
# Not a runtime dependency of the `fastdna` package itself.
# `polars` and `duckdb` back `python/tests/test_arrow_interop.py`, which
# verifies `.table` (a zero-copy pyarrow.Table) is consumed without friction
# by the Arrow-native tools people actually reach for -- not just pyarrow
# itself. Neither is a runtime dependency of the `fastdna` package itself;
# that test module uses `pytest.importorskip` so their absence skips rather
# than fails.
# Test-only extras. None is a runtime dependency of the `fastdna` package:
# `numpy` is used lazily by the modules that need it, and everything else
# here backs a test rather than the library.
# `tqdm` backs `python/fastdna/_progress.py`'s `progress=True` path (a live
# bar during `count()`, see `make_progress_adapter`/`_tqdm_sink`) -- without
# it declared here, that path is a soft dependency with no extra that
# actually installs it, so it is only ever exercised on a machine where some
# unrelated package happened to pull tqdm in transitively.
#
# The scikit-learn/scipy/shap/umap-learn/biopython/matplotlib/pandas stack
# that used to live here went with the ML layer (2026-09-05, see CHANGELOG):
# nothing in this package imports any of them any more.
# Shown on the PyPI page as the "Project links" sidebar. Without these the
# page is a dead end: no route from the package back to the source, the
# benchmarks or a place to report a bug.
[project.urls]
Homepage = "https://github.com/Angel-Zeledon/FastDNA"
Source = "https://github.com/Angel-Zeledon/FastDNA"
Issues = "https://github.com/Angel-Zeledon/FastDNA/issues"
Changelog = "https://github.com/Angel-Zeledon/FastDNA/blob/master/CHANGELOG.md"
Benchmarks = "https://github.com/Angel-Zeledon/FastDNA/blob/master/docs/BENCHMARKS.md"

[project.optional-dependencies]
test = [
    "duckdb>=1.0",
    "numpy",
    "polars>=1.0",
    "pytest>=7",
    "pytest-timeout>=2.1",
    "tqdm",
]
# Docs-only: builds the MkDocs site (`mkdocs.yml`, pages under `docs/site/`).
# None of these is a runtime dependency of the `fastdna` package.
# `mkdocstrings[python]` generates the API reference from the docstrings in
# `python/fastdna/` rather than from hand-copied prose. Its Python handler
# reads the package *statically* (griffe), so building the site needs neither
# a compiled `fastdna._core` nor any of the `test` extra's scientific stack
# installed -- which is what lets .github/workflows/docs.yml skip maturin and
# the Rust toolchain entirely. Do not switch the handler to dynamic analysis
# without giving that workflow a real build.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# No `[tool.pytest.ini_options]` section existed before `fastdna.datasets`
# (see `python/tests/test_datasets.py`): this project had no prior
# convention for opt-in slow/network tests. Registering `network` here only
# silences pytest's "unknown mark" warning for `@pytest.mark.network` -- it
# does NOT add it to a default-deselect `addopts`, so a plain `pytest` run
# still executes those two tests (they hit real BV-BRC/HIVDB endpoints).
# Deselect them explicitly with `-m "not network"` when that is not wanted.
[tool.pytest.ini_options]
markers = [
    "network: hits a real external endpoint (BV-BRC, Stanford HIVDB) end to end; not mocked",
]

[tool.maturin]
features = ["python"]
module-name = "fastdna._core"
python-source = "python"
# maturin copies `python-source` whole into the wheel and does not consult
# .gitignore to do it. Without these patterns, a `python -c "import
# fastdna"` or a pytest run before `maturin build` leaves
# `python/fastdna/__pycache__/` in the tree, and that bytecode ends up
# inside the published artifact: measured at 30 entries and 715,837
# bytes, 34% of extra wheel size. Worse than the size is that it is
# bytecode from one specific CPython version inside an abi3 wheel that
# declares 3.8-3.13+ coverage, and that the wheel's contents end up
# depending on which interpreters touched the directory before building.
# CI does a clean checkout, so this only manifests in manual builds --
# exactly the case of a hand-done release upload.
#
# `docs/history/**` is excluded for a different reason: those fifteen files
# are working documents from states the project has passed through, and
# `docs/history/README.md` opens by saying nothing in there describes the
# current code. They are 22% of the source distribution's bytes. Git keeps
# them; a published artifact should not carry a fifth of its weight in
# documentation of deleted features.
exclude = ["**/__pycache__/**", "**/*.pyc", "docs/history/**"]
# `python/fastdna/py.typed` (the empty PEP 561 marker) is already included:
# it lives inside `python-source` above, and neither exclude pattern above
# matches it (only `__pycache__/` directories and `.pyc` files do). It is
# named here anyway because `exclude` is the one place that could silently
# start dropping it if its patterns are ever broadened -- without the
# marker actually shipping in the wheel, mypy/pyright treat an installed
# `fastdna` as untyped and every annotation in this package (H-05) is
# invisible to a consuming project, regardless of how complete it is.
