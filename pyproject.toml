[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fastdna"
requires-python = ">=3.8"
dependencies = ["pyarrow>=14"]
# Not in the plan's original snippet: this maturin release (1.14.1) refuses
# to build without either a static `project.version` or this `dynamic`
# declaration. `dynamic` is used, so the version stays sourced from
# Cargo.toml's `[package] version` alone -- the same value `ffi.rs` reports
# to Python via `env!("CARGO_PKG_VERSION")` -- rather than duplicating it.
dynamic = ["version"]

# Test-only: `pytest-timeout` backs `@pytest.mark.timeout(...)` in
# `python/tests/test_api.py`, used on the zero-threads regression test so a
# reintroduced hang fails the test instead of blocking the suite forever.
# Not a runtime dependency of the `fastdna` package itself.
# `polars` and `duckdb` back `python/tests/test_arrow_interop.py`, which
# verifies `.table` (a zero-copy pyarrow.Table) is consumed without friction
# by the Arrow-native tools people actually reach for -- not just pyarrow
# itself. Neither is a runtime dependency of the `fastdna` package itself;
# that test module uses `pytest.importorskip` so their absence skips rather
# than fails.
# `numpy`, `scipy`, `scikit-learn` and `shap` back
# `python/tests/test_interpret.py` only -- none is a dependency of
# `fastdna.interpret` itself, which imports nothing but `pyarrow` at module
# level. Its two core functions (`top_features`,
# `export_top_features_fasta`) are pure Python over plain array-likes; only
# `explain_with_shap` needs `shap`/`numpy`, and it imports both lazily
# inside the function body, raising a clear "pip install shap" ImportError
# rather than a raw one when `shap` is absent. `shap` in particular drags
# in the full scientific stack (numba/llvmlite), which is exactly why it
# stays a test-only extra and never a runtime dependency of the wheel.
# In the test module, `pytest.importorskip("shap", ...)` is called inside
# the one test that needs it -- not at module level -- so a missing `shap`
# skips only that test rather than the whole file.
[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-timeout>=2.1",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "shap",
]

[tool.maturin]
features = ["python"]
module-name = "fastdna._core"
python-source = "python"
