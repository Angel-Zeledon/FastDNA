[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fastdna"
requires-python = ">=3.8"
dependencies = ["pyarrow>=14"]
# Not in the plan's original snippet: this maturin release (1.14.1) refuses
# to build without either a static `project.version` or this `dynamic`
# declaration. `dynamic` is used, so the version stays sourced from
# Cargo.toml's `[package] version` alone -- the same value `ffi.rs` reports
# to Python via `env!("CARGO_PKG_VERSION")` -- rather than duplicating it.
dynamic = ["version"]

# Test-only: `pytest-timeout` backs `@pytest.mark.timeout(...)` in
# `python/tests/test_api.py`, used on the zero-threads regression test so a
# reintroduced hang fails the test instead of blocking the suite forever.
# Not a runtime dependency of the `fastdna` package itself.
# `polars` and `duckdb` back `python/tests/test_arrow_interop.py`, which
# verifies `.table` (a zero-copy pyarrow.Table) is consumed without friction
# by the Arrow-native tools people actually reach for -- not just pyarrow
# itself. Neither is a runtime dependency of the `fastdna` package itself;
# that test module uses `pytest.importorskip` so their absence skips rather
# than fails.
# `pandas` backs `python/tests/test_multiomics.py`: `fastdna.multiomics`
# deliberately returns `pandas.DataFrame` from `join_omics_layers` (most
# other-omics/clinical data already lives in pandas in practice), so its
# tests need pandas to construct sample "other layer" DataFrames and to
# assert on the joined result. Not a runtime dependency of the `fastdna`
# package itself -- `fastdna.multiomics` imports pandas lazily, inside the
# functions that need it, exactly like `polars` is imported lazily in
# `KmerCounts.to_polars()` above.
[project.optional-dependencies]
test = ["pytest>=7", "pytest-timeout>=2.1", "polars>=1.0", "duckdb>=1.0", "pandas>=2.0"]

[tool.maturin]
features = ["python"]
module-name = "fastdna._core"
python-source = "python"
