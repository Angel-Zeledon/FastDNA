[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fastdna"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
description = "Fast canonical k-mer counting from FASTQ, with a zero-copy Arrow bridge to Python"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "kmer", "fastq", "arrow"]
dependencies = ["pyarrow>=14"]
# Not in the plan's original snippet: this maturin release (1.14.1) refuses
# to build without either a static `project.version` or this `dynamic`
# declaration. `dynamic` is used, so the version stays sourced from
# Cargo.toml's `[package] version` alone -- the same value `ffi.rs` reports
# to Python via `env!("CARGO_PKG_VERSION")` -- rather than duplicating it.
dynamic = ["version"]

# Test-only: `pytest-timeout` backs `@pytest.mark.timeout(...)` in
# `python/tests/test_api.py`, used on the zero-threads regression test so a
# reintroduced hang fails the test instead of blocking the suite forever.
# Not a runtime dependency of the `fastdna` package itself.
# `polars` and `duckdb` back `python/tests/test_arrow_interop.py`, which
# verifies `.table` (a zero-copy pyarrow.Table) is consumed without friction
# by the Arrow-native tools people actually reach for -- not just pyarrow
# itself. Neither is a runtime dependency of the `fastdna` package itself;
# that test module uses `pytest.importorskip` so their absence skips rather
# than fails.
# Test-only extras. None is a runtime dependency of the `fastdna` package:
# every module needing one is opt-in, or imports it lazily inside the single
# function that uses it. `shap` matters most -- it pulls in numba and
# llvmlite, which many users cannot install.
# `biopython` backs `python/tests/test_interop.py`'s claim that
# `fastdna.interop` accepts real Biopython `SeqRecord` objects, not just the
# hand-written fake used when biopython is absent. Without it in this extra,
# that headline claim is only ever verified because biopython happened to
# already be installed on whichever machine ran the tests -- never in a
# clean CI environment. `matplotlib` backs `python/fastdna/plotting.py` and
# `genomescope.plot_spectrum_fit`'s own tests, both of which otherwise skip
# via `pytest.importorskip` rather than genuinely exercising the drawing code.
[project.optional-dependencies]
test = [
    "biopython",
    "duckdb>=1.0",
    "matplotlib",
    "numpy",
    "pandas>=2.0",
    "polars>=1.0",
    "pytest>=7",
    "pytest-timeout>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "shap",
    "umap-learn>=0.5",
]

# No `[tool.pytest.ini_options]` section existed before `fastdna.datasets`
# (see `python/tests/test_datasets.py`): this project had no prior
# convention for opt-in slow/network tests. Registering `network` here only
# silences pytest's "unknown mark" warning for `@pytest.mark.network` -- it
# does NOT add it to a default-deselect `addopts`, so a plain `pytest` run
# still executes those two tests (they hit real BV-BRC/HIVDB endpoints).
# Deselect them explicitly with `-m "not network"` when that is not wanted.
[tool.pytest.ini_options]
markers = [
    "network: hits a real external endpoint (BV-BRC, Stanford HIVDB) end to end; not mocked",
]

[tool.maturin]
features = ["python"]
module-name = "fastdna._core"
python-source = "python"
