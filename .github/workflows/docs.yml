# Builds the MkDocs documentation site (mkdocs.yml, pages under docs/site/).
#
# This workflow deliberately does NOT build the Rust extension. mkdocstrings'
# Python handler reads `python/fastdna/` statically via griffe, so the API
# reference is generated from the source tree itself -- no maturin, no Rust
# toolchain, no pyarrow/scikit-learn/scipy/matplotlib install, and no risk of
# the docs build inheriting a native-build failure that wheels.yml already
# covers. If the handler is ever switched to dynamic (import-based) analysis,
# this job has to grow a `maturin develop --features python` step first.
#
# `--strict` is the point of the build step, not decoration: it turns MkDocs
# warnings into a non-zero exit, so a nav entry pointing at a file that no
# longer exists, an internal link that no longer resolves, or a `::: fastdna.x`
# identifier removed from the package fails here instead of silently
# publishing a broken page.
#
# Publishing is opt-in -- see the `deploy` job at the bottom for exactly what
# has to be true before anything is published.

name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two runs of this workflow must never race to publish. Pages deployments are
# not commutative: the older one finishing last would overwrite the newer.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Installed by name rather than as `pip install ".[docs]"`, which would
      # also build and install `fastdna` itself -- and building fastdna means
      # maturin and a Rust toolchain, which this job exists to avoid needing.
      # These are the same three packages, with the same lower bounds, that
      # pyproject.toml's `[project.optional-dependencies] docs` extra names;
      # keep the two lists in step.
      #
      # `black` is not part of that extra: it is only used by mkdocstrings to
      # pretty-print long signatures (`separate_signature: true` in
      # mkdocs.yml). Without it the build still succeeds and simply logs that
      # signature formatting is unavailable.
      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs>=1.6" \
            "mkdocs-material>=9.5" \
            "mkdocstrings[python]>=0.25" \
            black

      - name: Build with MkDocs (strict)
        run: mkdocs build --strict

      # `site_dir` in mkdocs.yml is target/docs-site, not the MkDocs default
      # `site/`, so that a local build lands somewhere .gitignore already
      # ignores. Both steps below therefore have to name that path explicitly.
      - name: Upload site as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: target/docs-site
          if-no-files-found: error

      # Packages the same directory in the single-file tar format
      # actions/deploy-pages expects. Uploading it unconditionally costs one
      # artifact and keeps the deploy job below to a single step; it publishes
      # nothing on its own.
      - name: Package site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

  # Publishing is gated on a repository variable rather than being wired up
  # unconditionally, because `actions/deploy-pages` fails the workflow when
  # GitHub Pages has not been enabled for the repository, with Source set to
  # "GitHub Actions", in Settings -> Pages. That setting cannot be made from
  # inside a workflow file and has not been verified for this repository, so
  # switching it on blindly here would turn every push red.
  #
  # To enable publishing, once and by hand:
  #   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
  #   2. Settings -> Secrets and variables -> Actions -> Variables:
  #      add ENABLE_GITHUB_PAGES = true.
  # The site then publishes from the default branch on every push, and the
  # `build` job above keeps running (and keeps `--strict` honest) on branches
  # and pull requests without publishing anything.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      vars.ENABLE_GITHUB_PAGES == 'true'
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      # `pages: write` and `id-token: write` are what actions/deploy-pages
      # needs; they are scoped to this job so the build job above keeps the
      # read-only default token.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
