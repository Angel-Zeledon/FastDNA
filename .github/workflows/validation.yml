# Runs the external-reference validation suite in `scripts/validation/`.
#
# WHY THIS IS A SEPARATE WORKFLOW, and not steps bolted onto `ci.yml`.
#
# `ci.yml` is the gate: it runs on every push, finishes in minutes, and
# needs no network beyond fetching crates and wheels. Everything here breaks
# all three of those properties on purpose -- it pulls ~100 MB of real
# sequencing data from ENA, pulls two biocontainers from quay.io, and
# takes tens of minutes. Putting that on the per-push path would make the
# gate slow AND flaky for reasons that have nothing to do with the change
# under test (ENA being down is not a regression in this repository).
#
# But leaving it un-run is exactly the failure this repo already has a
# history of. `docs/BENCHMARKS.md` records an exact agreement with KMC3 that
# nothing re-checks; `scripts/bench/crosscheck.py` was written specifically
# so a claim would fail loudly when it stopped being true, and no workflow
# ever invoked it; and `audit.py` justified a constant by citing
# `scratch/amr_repro/audit_report.json`, a file under a gitignored directory
# that is not in the repository at all. Every one of those is the same bug:
# evidence with no mechanism to re-derive it.
#
# So: scheduled, not per-push. Slow and networked is fine when nothing is
# waiting on it; silent is not.

name: Validation (external references)

on:
  # 05:00 UTC daily. Nothing is blocked on this, so the time only matters
  # for not colliding with the busiest hours of the public endpoints it
  # depends on (ENA, quay.io).
  schedule:
    - cron: "0 5 * * *"
  # So a human can run it on demand -- before cutting a release, or after
  # touching anything in the counting path -- without waiting for the
  # schedule or pushing a dummy commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: FastDNA vs KMC3 and Mash
    runs-on: ubuntu-latest
    # Generous: a cold run downloads ~100 MB of reads plus two
    # biocontainers, builds with `--release` (fat LTO, one codegen unit --
    # Cargo.toml documents that this is deliberately slow), and then runs
    # several full k-mer counts. It should finish well inside this; the
    # limit exists so a hung download cannot sit for six hours.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # `--release`, unlike `ci.yml`'s debug build, and not for speed alone:
      # these scripts count real files, and a debug build was measured 4-5x
      # slower in this project's own benchmarking (see the README). It also
      # means this workflow is the one place where `[profile.release]`'s
      # `panic = "unwind"` is exercised outside `wheels.yml`.
      #
      # No `--features python` here: per `ci.yml`'s header, a bare cargo
      # build must never enable it. The Python side arrives via maturin
      # below.
      - name: Build the release binary
        run: cargo build --release

      - name: Install the Python extension and its test extras
        run: |
          set -euo pipefail
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install "maturin>=1.5,<2.0"
          ./.venv/bin/maturin develop --release --features python --extras test

      # Each step is separate so the checks list names which reference tool
      # disagreed, rather than reporting one opaque "validation failed".

      # Exact equality, no tolerance: with trimming disabled and singletons
      # kept, FastDNA and KMC3 solve the identical problem. Any difference
      # at all is a counting bug.
      - name: Counting is exactly KMC3's (real reads)
        run: |
          python scripts/validation/kmc3_equivalence.py \
            --json "${RUNNER_TEMP}/kmc3.json"

      # The u128 engine, against the same outside answer. KMC3 counts to
      # k=256, so it is a real source of truth here and not only for the
      # u64 path. k=33 and k=64 are the ends of the wide engine's range --
      # the two values a masking or shift bug would show up at first -- and
      # `--engine wide` at k=31 runs the wide engine inside the OVERLAP,
      # where KMC3 answers directly instead of the check bottoming out at
      # "the two engines agree with each other".
      - name: Counting above k=32 is exactly KMC3's too
        run: |
          for k in 33 64; do
            python scripts/validation/kmc3_equivalence.py \
              --k "$k" --json "${RUNNER_TEMP}/kmc3_k${k}.json"
          done
          python scripts/validation/kmc3_equivalence.py \
            --k 31 --engine wide --json "${RUNNER_TEMP}/kmc3_k31_wide.json"

      # The two approximate answers, each against its own documented bound
      # and against the exact count of the same file.
      - name: Estimators are inside their documented bounds
        run: |
          python scripts/validation/estimator_accuracy.py \
            --json "${RUNNER_TEMP}/estimators.json"

      # Mash needs a handful of genuinely different genomes, not a large
      # cohort. Five reference assemblies straight from NCBI: stable
      # versioned paths (each URL was verified to resolve when this step was
      # written), no dataset loader, no API key, and small enough that the
      # download is not the slow part of this job.
      - name: Sketch distances agree with Mash
        run: |
          set -euo pipefail
          mkdir -p mash_genomes
          base=https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF
          for path in \
            000/005/845/GCF_000005845.2_ASM584v2 \
            000/006/945/GCF_000006945.2_ASM694v2 \
            000/009/045/GCF_000009045.1_ASM904v1 \
            000/013/425/GCF_000013425.1_ASM1342v1 \
            000/006/765/GCF_000006765.1_ASM676v1 ; do
            name=$(basename "$path")
            curl -fsSL "$base/$path/${name}_genomic.fna.gz" \
              | gunzip > "mash_genomes/${name}.fna"
          done
          ls -la mash_genomes
          python scripts/validation/sketch_vs_mash.py --genomes mash_genomes

      # KMC3 does not report similarity, but `kmc_tools` computes the set
      # operations it is made of, so it can be the oracle for `fastdna
      # similarity`'s exact Jaccard and containment. Two halves of one read
      # set, so the overlap is large and partial rather than trivially 0
      # or 1.
      - name: Exact similarity agrees with KMC3's set operations
        run: |
          python scripts/validation/similarity_vs_kmc_tools.py \
            --reads-per-half 100000 \
            --json "${RUNNER_TEMP}/similarity.json"

      # Uploaded even on failure: the JSON is what a human compares against
      # the previous run to see whether a number moved a little or a lot.
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          path: ${{ runner.temp }}/*.json
          if-no-files-found: warn

  # A separate job, not another step above, for two reasons: a benchmark
  # that regresses must not read as a correctness failure, and this one
  # needs a machine rather than a network -- it is the only thing in this
  # repository whose result depends on what hardware it ran on.
  benchmark:
    name: Head to head vs KMC3
    runs-on: ubuntu-latest
    # x86-64 by definition on a GitHub-hosted ubuntu runner, which is the
    # entire reason this job exists rather than a make target a developer
    # runs: KMC3 and FASTK ship x86-64 Linux binaries, so on the arm64 Macs
    # this project is developed on they run emulated, and an emulated
    # competitor makes FastDNA look good for a reason that is not speed.
    # `scripts/bench/head_to_head.py` refuses to report timings off x86-64
    # for that reason; here it does not have to.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install numpy for the read generator
        run: python -m pip install --quiet numpy

      - name: Build the release binary
        run: cargo build --release

      # A 6 Mbp reference at 30x is ~390 MB and 144,000,000 k-mer
      # occurrences -- large enough that the strategies separate (the
      # binned path is measurably ahead of the in-memory one at this size,
      # see docs/BENCHMARKS.md) and small enough to fit a runner's 14 GB of
      # disk alongside KMC3's working directory. The 2.14 GB file the
      # historical table used does not fit here with room for KMC3's
      # scratch, and a benchmark that dies on a full disk measures nothing.
      - name: FastDNA vs KMC3, natively, on the same file
        run: |
          python scripts/bench/head_to_head.py \
            --genome-size 6000000 \
            --json "${RUNNER_TEMP}/head_to_head.json"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: head-to-head
          path: ${{ runner.temp }}/head_to_head.json
          if-no-files-found: warn
